<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shaghof Todo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --blue-900: #082f49;
      --blue-800: #075985;
      --blue-700: #0369a1;
      --blue-600: #0284c7;
      --blue-500: #0ea5e9;
      --blue-100: #e0f2fe;
      --blue-50: #f0f9ff;
      --green: #16a34a;
      --green-dark: #15803d;
      --white: #ffffff;
      --text: #123047;
      --muted: #64748b;
      --danger: #ef4444;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(125, 211, 252, .55), transparent 30%),
        radial-gradient(circle at 90% 90%, rgba(14, 165, 233, .35), transparent 30%),
        linear-gradient(135deg, #e0f2fe 0%, #bae6fd 45%, #7dd3fc 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 16px;
      position: relative;
    }

    .logo {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 74px;
      height: 74px;
      object-fit: contain;
      z-index: 10;
      filter: drop-shadow(0 7px 14px rgba(2, 132, 199, .28));
    }

    .app {
      width: min(760px, 100%);
      background: rgba(255, 255, 255, .90);
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 28px;
      padding: 30px;
      box-shadow: 0 25px 60px rgba(3, 105, 161, .22);
      backdrop-filter: blur(14px);
      position: relative;
      z-index: 1;
      overflow: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      position: relative;
      z-index: 2;
    }

    .title-area h1 {
      margin: 0 0 6px;
      font-size: clamp(26px, 5vw, 38px);
      color: var(--blue-900);
    }

    .title-area p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .score {
      min-width: 130px;
      padding: 15px 18px;
      border-radius: 18px;
      text-align: center;
      background: linear-gradient(135deg, var(--blue-800), var(--blue-500));
      color: white;
      box-shadow: 0 10px 24px rgba(2, 132, 199, .25);
    }

    .score-label {
      display: block;
      font-size: 12px;
      opacity: .9;
      margin-bottom: 3px;
    }

    .score-number {
      font-size: 30px;
      font-weight: 800;
    }

    .form {
      display: flex;
      flex-direction: column;
      gap: 13px;
      position: relative;
      z-index: 2;
    }

    input, textarea, select {
      width: 100%;
      border: 2px solid #dbeafe;
      border-radius: 14px;
      padding: 14px 15px;
      font: inherit;
      color: var(--text);
      background: var(--blue-50);
      outline: none;
      transition: .2s ease;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--blue-500);
      box-shadow: 0 0 0 4px rgba(14, 165, 233, .12);
      background: white;
    }

    textarea {
      min-height: 105px;
      resize: vertical;
    }

    .options-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 13px;
    }

    .field-label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
      color: var(--blue-800);
    }

    select {
      border-color: #bbf7d0;
      background: #f0fdf4;
      color: var(--green-dark);
      font-weight: 700;
      cursor: pointer;
    }

    .add {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      background: linear-gradient(135deg, var(--blue-800), var(--blue-500));
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 9px 20px rgba(2, 132, 199, .25);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .add:hover {
      transform: translateY(-2px);
      box-shadow: 0 13px 25px rgba(2, 132, 199, .32);
    }

    .hint {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .tasks {
      margin-top: 26px;
      position: relative;
      z-index: 2;
    }

    .tasks-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .tasks-header h2 {
      margin: 0;
      font-size: 18px;
      color: var(--blue-900);
    }

    .count {
      font-size: 12px;
      color: var(--muted);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 10px;
    }

    li {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 16px;
      border: 1px solid #dbeafe;
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 6px 16px rgba(8, 47, 73, .07);
    }

    .task-main {
      min-width: 0;
    }

    .task-top {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 5px;
    }

    .task-title {
      font-size: 16px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .task-description {
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .badge {
      padding: 5px 9px;
      border-radius: 999px;
      background: #dcfce7;
      color: var(--green-dark);
      font-size: 11px;
      font-weight: 800;
    }

    .points {
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--blue-100);
      color: var(--blue-800);
      font-size: 11px;
      font-weight: 800;
    }

    .done {
      text-decoration: line-through;
      opacity: .55;
    }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .done-btn {
      border: 0;
      border-radius: 10px;
      padding: 9px 12px;
      background: #dcfce7;
      color: var(--green-dark);
      font-weight: 800;
      cursor: pointer;
    }

    .done-btn:hover {
      background: #bbf7d0;
    }

    .done-btn.completed {
      background: var(--green);
      color: white;
      cursor: default;
    }

    .delete-btn {
      border: 0;
      border-radius: 10px;
      padding: 9px 11px;
      background: #fee2e2;
      color: #b91c1c;
      font-weight: 800;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      padding: 28px 15px;
      color: var(--muted);
      border: 2px dashed #bae6fd;
      border-radius: 17px;
      background: rgba(240, 249, 255, 0.7);
    }

    @media (max-width: 620px) {
      body {
        align-items: flex-start;
        padding: 105px 12px 24px;
      }

      .logo {
        width: 62px;
        height: 62px;
        top: 18px;
        left: 18px;
      }

      .app {
        padding: 21px;
        border-radius: 22px;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
      }

      .score {
        width: 100%;
      }

      .options-row {
        grid-template-columns: 1fr;
      }

      li {
        grid-template-columns: 1fr;
      }

      .task-actions {
        justify-content: flex-end;
      }
    }
  </style>
</head>

  <main class="app">
    <header class="header">
      <div class="title-area">
        <h1>Todo List</h1>
        <p>Organize your day. Complete your goals. Earn points.</p>
      </div>

      <div class="score">
        <span class="score-label">⭐ My Points</span>
        <span id="score" class="score-number">0</span>
      </div>
    </header>

    <section class="form">
      <input
        id="title"
        type="text"
        placeholder="Task title..."
        autocomplete="off"
      />

      <textarea
        id="description"
        placeholder="Write a short description..."
      ></textarea>

      <div class="options-row">
        <div>
          <label class="field-label" for="category">Task Type</label>
          <select id="category">
            <option value="done">✅ Done +1</option>
            <option value="study">📚 Study +1</option>
            <option value="project">💻 Project +5</option>
            <option value="meeting">🤝 Meeting +3</option>
          </select>
        </div>
      </div>

      <button class="add" onclick="add()">＋ Add Task</button>

      <p class="hint">Press Enter in the title or description to add the task.</p>
    </section>

    <section class="tasks">
      <div class="tasks-header">
        <h2>My Tasks</h2>
        <span id="count" class="count">0 tasks</span>
      </div>

      <ul id="list"></ul>
    </section>
  </main>

  <script>
    const pointsByCategory = {
      done: 1,
      study: 1,
      project: 5,
      meeting: 3
    };

    const categoryNames = {
      done: "Done",
      study: "Study",
      project: "Project",
      meeting: "Meeting"
    };

    let todos = JSON.parse(localStorage.getItem("shaghofTodos") || "[]");
    let totalPoints = parseInt(localStorage.getItem("shaghofPoints"), 10) || 0;

    function saveData() {
      localStorage.setItem("shaghofTodos", JSON.stringify(todos));
      localStorage.setItem("shaghofPoints", String(totalPoints));
    }

    function add() {
      const titleInput = document.getElementById("title");
      const descriptionInput = document.getElementById("description");
      const categoryInput = document.getElementById("category");

      const title = titleInput.value.trim();
      const description = descriptionInput.value.trim();
      const category = categoryInput.value;

      if (!title) {
        titleInput.focus();
        return;
      }

      const taskPoints = pointsByCategory[category] || 1;

      todos.push({
        id: Date.now(),
        title: title,
        description: description,
        category: category,
        status: false,
        points: taskPoints
      });

      titleInput.value = "";
      descriptionInput.value = "";
      categoryInput.value = "done";

      saveData();
      render();
      titleInput.focus();
    }

    function remove(index) {
      const todo = todos[index];

      if (todo && todo.status) {
        totalPoints -= (parseInt(todo.points, 10) || 0);
      }

      totalPoints = Math.max(0, totalPoints);
      todos.splice(index, 1);

      saveData();
      render();
    }

    function toggleStatus(index) {
      const todo = todos[index];

      if (!todo) return;

      if (!todo.status) {
        todo.status = true;
        totalPoints += (parseInt(todo.points, 10) || 0);
      }

      saveData();
      render();
    }

    function render() {
      const list = document.getElementById("list");
      const score = document.getElementById("score");
      const count = document.getElementById("count");

      list.innerHTML = "";
      score.textContent = totalPoints;
      count.textContent = `${todos.length} ${todos.length === 1 ? "task" : "tasks"}`;

      if (todos.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No tasks yet. Add your first goal 🚀";
        list.appendChild(empty);
        return;
      }

      todos.forEach((todo, i) => {
        const li = document.createElement("li");

        const main = document.createElement("div");
        main.className = "task-main";

        const top = document.createElement("div");
        top.className = "task-top";

        const title = document.createElement("span");
        title.className = "task-title";
        title.textContent = todo.title;

        if (todo.status) {
          title.classList.add("done");
        }

        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = categoryNames[todo.category] || "Task";

        const points = document.createElement("span");
        points.className = "points";
        points.textContent = `+${todo.points} pts`;

        top.appendChild(title);
        top.appendChild(badge);
        top.appendChild(points);

        main.appendChild(top);

        if (todo.description) {
          const description = document.createElement("p");
          description.className = "task-description";
          description.textContent = todo.description;
          main.appendChild(description);
        }

        const actions = document.createElement("div");
        actions.className = "task-actions";

        const done = document.createElement("button");
        done.className = "done-btn";
        done.textContent = todo.status ? "✓ Completed" : `Done (+${todo.points})`;

        if (todo.status) {
          done.classList.add("completed");
        } else {
          done.onclick = () => toggleStatus(i);
        }

        const del = document.createElement("button");
        del.className = "delete-btn";
        del.textContent = "×";
        del.title = "Delete task";
        del.onclick = () => remove(i);

        actions.appendChild(done);
        actions.appendChild(del);

        li.appendChild(main);
        li.appendChild(actions);
        list.appendChild(li);
      });
    }

    document.getElementById("title").addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        add();
      }
    });

    document.getElementById("description").addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        add();
      }
    });

    render();
  </script>
</body>
</html>
